<!DOCTYPE html>

<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e1013;--pn:#171a1f;--pn2:#1f2329;--bd:#2c323a;--tx:#e8eaed;--mu:#8b93a0;--ac:#f5a524;--ok:#3ecf8e;--no:#ef5350}
html{height:100%}*,*:before,*:after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:140px}header h1 span{color:var(--ac)}
#ver{font-size:12px;color:var(--mu)}#ver.dirty{color:var(--ac)}
#clock{font:600 18px ui-monospace,monospace;color:var(--ac)}
button,.btn{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}button.d{color:var(--no)}button:disabled{opacity:.4;cursor:default}
main{flex:1;display:flex;min-height:0}
#list{width:340px;max-width:42%;overflow:auto;border-right:1px solid var(--bd);padding:8px}
#ed{flex:1;overflow:auto;padding:14px}
.it{background:var(--pn);border:1px solid var(--bd);border-left:4px solid var(--mu);border-radius:6px;padding:8px 10px;margin-bottom:4px;cursor:pointer}
.it.sel{border-color:var(--ac);background:var(--pn2)}.it.now{box-shadow:0 0 0 1px var(--ac)}
.it.s-listo{border-left-color:var(--ok)}.it.s-curso{border-left-color:var(--ac)}
.it b{display:block}.it small{color:var(--mu)}
.cat{font:700 12px system-ui;letter-spacing:.08em;color:var(--ac);padding:10px 4px 4px;text-transform:uppercase}.cat{color:var(--ac);font-weight:700;letter-spacing:.08em;font-size:12px;padding:10px 2px 4px}.gap{font-size:12px;color:var(--mu);text-align:center;padding:2px}.gap.t{color:var(--no)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
label{display:block;color:var(--mu);font-size:12px;margin-bottom:3px}
input,textarea,select{width:100%;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px;font:inherit}
textarea{min-height:84px;resize:vertical}input:focus,textarea:focus,select:focus{outline:1px solid var(--ac)}
input:disabled,textarea:disabled,select:disabled{opacity:.75}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row label{display:inline;margin:0}.row input[type=checkbox]{width:auto}
.f{display:flex;gap:8px;align-items:center;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px;margin:4px 0}
.f img{height:44px;border-radius:4px}.f a{color:var(--ac);flex:1;word-break:break-all}
.big img{max-width:100%;border-radius:6px;margin:6px 0}
#msg{color:var(--no);padding:6px 14px}#msg:empty{display:none}.empty{color:var(--mu);padding:30px;text-align:center}
body.ro .edit{display:none}
#tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--pn)}#tools[hidden]{display:none}
#back{display:none;margin-bottom:10px}
@media(max-width:700px){header{padding:8px 10px}header h1 small{display:none}#clock{font-size:15px}main{flex-direction:column}#list{width:100%;max-width:none;flex:1;border:0}body:not(.ed) #ed{display:none}body.ed #list{display:none}#back{display:inline-block}input,textarea,select{font-size:16px}.it{padding:11px 12px}#ed{padding:10px}}
#pl{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#pl[hidden]{display:none}
#pbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);flex-wrap:wrap}#pbar b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pmain{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}#pbar button{padding:5px 8px;font-size:13px}
#ppal{width:240px;overflow:auto;border-right:1px solid var(--bd);padding:8px;background:var(--pn)}
#ppal summary{cursor:pointer;font-weight:700;padding:6px 0}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:6px}
.pg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px;font-size:11px;line-height:1.15;text-align:center}
#pcv{flex:1;min-width:0;background:#0b0d10}#psv{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#pins{border-top:1px solid var(--bd);padding:8px;max-height:34%;overflow:auto;background:var(--pn)}#pins:empty{display:none}
#pins .row{margin-bottom:6px;align-items:flex-end}#pins label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);margin:0}
#pins input[type=number]{width:78px}#pins input[data-f=l]{width:170px}#pins select{width:auto}#pins input[type=color]{width:46px;height:32px;padding:1px}#pins input[type=checkbox]{width:22px;height:22px}
.hint{color:var(--mu);font-size:12px}.mo{display:none}
@media(max-width:700px){#ppal{position:absolute;left:0;right:0;bottom:0;top:auto;height:100%;max-height:60%;width:auto;z-index:5;border-top:2px solid var(--ac);transform:translateY(110%);transition:transform .2s}#ppal.open{transform:none}.mo{display:inline-block}.pg{grid-template-columns:repeat(3,1fr)}}
#gt{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center}#gt[hidden]{display:none}
.gbox{width:min(340px,90vw);display:flex;flex-direction:column;gap:12px}.gbox h2{margin:0}.gbox h2 span{color:var(--ac)}#gms{color:var(--no);min-height:18px}.gbox label.row{color:var(--mu)}.gbox label.row input{width:auto}
body:not(.isED) .eo{display:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;padding:10px;background:var(--pn)}.seg button.on{background:var(--ac);color:#111;font-weight:700}
body:not(.isG) .go{display:none}
#prt{display:none}#prt.measure{display:block;position:fixed;left:0;top:0;visibility:hidden;z-index:-1}
#sh{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}#sh[hidden]{display:none}
.shb{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:16px;width:min(360px,92vw);display:flex;flex-direction:column;gap:10px}.shb h3{margin:0}.shb label{margin:0}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}body{display:block!important}body>*:not(#prt){display:none!important}#prt,#prt.measure{display:block!important;position:static!important;visibility:visible!important}}
</style></head><body>
<header><h1>Teletón · <span>Stage Manager</span> <small style="color:var(--mu)">Estadio Nacional</small><br><span id="ver"></span></h1><span id="clock"></span><button id="tg">⚙ Herramientas</button></header>
<div id="tools" hidden><label class="row eo"><input type="checkbox" id="ro"> Solo lectura</label>
<button class="p edit" id="add">+ Bloque</button><button class="eo" id="exp">⬇ Exportar .json</button><label class="btn eo">⬆ Importar .json<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="eo" id="pub">☁ Publicar</button><button class="eo" id="ghc">⚙ GitHub</button><button class="go" id="rf">↻ Actualizar</button><button id="chkf">🔍 Verificar adjuntos</button><button class="go" id="fixfiles">⟳ Re-descargar adjuntos</button><button id="fixapp">🧹 Actualizar app</button><button id="out">🔒 Salir</button></div>
<div id="msg"></div>
<main><div id="list"></div><div id="ed"><div class="empty">Cargando…</div></div></main>
<div id="pl" hidden><div id="pbar"><button id="pcl">← Volver</button><b id="ptt"></b><button id="pau" class="edit" title="Deshacer">↶</button><button id="pre" class="edit" title="Rehacer">↷</button><button id="ptg" class="edit mo p">＋ Elementos</button>
<button id="pth"></button><button id="pzm">−</button><button id="pfit">Ajustar</button><button id="pzp">＋</button><button id="ppng">⬇ PNG</button><button id="psh">🖨 Hoja</button><button id="patt" class="edit">📎 Adjuntar</button></div>
<div id="pmain"><div id="ppal" class="edit"><input id="pq" placeholder="Buscar elemento…"><div id="plist"></div></div><div id="pcv"><svg id="psv" xmlns="http://www.w3.org/2000/svg"></svg></div></div><div id="pins"></div></div>
<div id="gt"><div class="gbox"><h2>Teletón · <span>Stage Manager</span></h2>
<div class="seg"><button id="tgg">Invitado</button><button id="tsm">Stage Manager</button></div>
<div id="pg" class="gbox"><input id="gnm" placeholder="Tu nombre" autocomplete="name" maxlength="40"><div class="hint">Acceso de solo lectura a la última información publicada.</div><button class="p" id="ggo">Entrar como invitado</button></div>
<div id="pm" class="gbox" hidden><input id="gpw" type="password" autocomplete="current-password" placeholder="Contraseña del Stage Manager"><label class="row"><input type="checkbox" id="grem" checked> Recordar en este dispositivo</label><button class="p" id="gok">Entrar como Stage Manager</button></div>
<div id="gms"></div><div class="hint" id="appv"></div></div></div>
<div id="sh" hidden><div class="shb"><h3>🖨 Hoja imprimible</h3>
<label>Papel<select id="shp"><option value="Letter">Carta</option><option value="A4">A4</option></select></label>
<label>Orientación<select id="sho"><option value="portrait">Vertical</option><option value="landscape">Horizontal</option></select></label>
<label>Colores<select id="sht"><option value="light">Claro (para imprimir)</option><option value="dark">Oscuro</option></select></label>
<div class="hint">Incluye el stage plot y la información del bloque en una sola página. En el diálogo de impresión elige tu impresora o «Guardar como PDF».</div>
<div class="row"><button class="p" id="shgo">Imprimir / PDF</button><button id="shx">Cancelar</button></div></div></div>
<div id="prt"></div><style id="pgs"></style>
<script>
const $=s=>document.querySelector(s),T=[['audio','Equipo de audio'],['backline','Backline'],['stagehands','Stagehands'],['tv','Producción TV'],['sm','Stage manager de la banda'],['notes','Notas generales / cues']];
const ST={pendiente:'Pendiente',curso:'En curso',listo:'Listo'};
let D,S={},sel=null,built=null,pend={},tm={},urls={},loading={},fail={},ro=localStorage.getItem('tsm-ro')==='1';
const meta=()=>JSON.parse(localStorage.getItem('tsm-meta')||'{}'),setMeta=m=>{localStorage.setItem('tsm-meta',JSON.stringify({...meta(),...m}));ver()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{if(!t)return null;const[a,b]=t.split(':');return +a*60+ +b};
const msg=(t,ok)=>{const m=$('#msg');m.style.color=ok?'var(--ok)':'';m.textContent=t||''};
const fmt=i=>i?new Date(i).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function ver(){const m=meta();$('#ver').className=m.dirty?'dirty':'';$('#ver').textContent=(m.exported?'Versión del '+fmt(m.exported):'Sin versión exportada')+(m.dirty?' · cambios sin exportar':'')}
/* IndexedDB */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('teleton-sm',1);r.onupgradeneeded=()=>{r.result.createObjectStore('scenes',{keyPath:'id'});r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(st,mode,fn)=>new Promise((res,rej)=>{const t=D.transaction(st,mode);const o=fn(t);t.oncomplete=()=>res(o&&'result'in o?o.result:o);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const R={'PRE SHOW':0,'SHOW':1},cat=s=>s.cat||'SHOW';
const ids=()=>Object.keys(S).sort((a,b)=>(R[cat(S[a])]??1)-(R[cat(S[b])]??1)||(S[a].order||0)-(S[b].order||0));
function save(id,p){S[id]={...S[id],...p};pend[id]=1;setMeta({dirty:true});clearTimeout(tm[id]);tm[id]=setTimeout(()=>flush(id),400);renderList()}
async function flush(id){if(!pend[id]||!S[id])return;delete pend[id];try{await tx('scenes','readwrite',t=>t.objectStore('scenes').put({id,...S[id]}))}catch(e){msg('No se pudo guardar: '+e.message)}}
addEventListener('beforeunload',()=>Object.keys(pend).forEach(flush));
async function create(extra){const o=ids().length?Math.max(...ids().map(i=>S[i].order||0))+1:1;const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S[id]={order:o,band:'',cat:'SHOW',cat:'SHOW',kind:'Banda',start:'',end:'',status:'pendiente',files:[],...extra};pend[id]=1;setMeta({dirty:true});await flush(id);return id}
function nowId(){const n=new Date(),m=n.getHours()*60+n.getMinutes();return ids().find(i=>{const a=mins(S[i].start),b=mins(S[i].end);return a!=null&&b!=null&&m>=a&&m<b})}
function renderList(){const L=ids(),nw=nowId();let h=L.length?'':'<div class="empty">Sin bloques. Crea uno o importa un .json.</div>',pc=null,n=0;
L.forEach((id,k)=>{const s=S[id],c=cat(s);if(c!==pc){h+=`<div class="cat">${c}</div>`;pc=c;n=0}n++;h+=`<div class="it s-${s.status} ${id===sel?'sel':''} ${id===nw?'now':''}" data-id="${id}"><b>${n}. ${esc(s.band)||'(sin nombre)'}</b><small>${esc(s.kind)} · ${esc(s.start)||'--:--'}–${esc(s.end)||'--:--'} · ${ST[s.status]||''}${(s.files||[]).length?' · 📎'+s.files.length:''}</small></div>`;
const nx=S[L[k+1]];if(nx&&cat(nx)===c){const g=mins(nx.start)-mins(s.end);if(!isNaN(g))h+=`<div class="gap ${g<10?'t':''}">⇅ ${g} min hasta el siguiente</div>`}});
$('#list').innerHTML=h}
const fld=(k,l,type,v)=>`<div><label>${l}</label><input data-k="${k}" type="${type}" value="${esc(v)}"></div>`;
function build(){const s=S[sel];if(!s){$('#ed').innerHTML='<div class="empty">Elige o crea un bloque.</div>';built=null;return}
built=sel;$('#ed').innerHTML=`<button id="back" data-a="back">← Lista de bloques</button><div class="row"><button data-a="up">↑</button><button data-a="dn">↓</button>
<select data-k="status" style="width:auto">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select>
<select data-k="cat" style="width:auto">${['PRE SHOW','SHOW'].map(k=>`<option ${cat(s)===k?'selected':''}>${k}</option>`).join('')}</select>
<select data-k="kind" style="width:auto">${['Banda','Changeover','Bloque TV','Otro'].map(k=>`<option ${s.kind===k?'selected':''}>${k}</option>`).join('')}</select>
<select data-k="cat" style="width:auto">${['PRE SHOW','SHOW'].map(k=>`<option ${s.cat===k?'selected':''}>${k}</option>`).join('')}</select>
<span style="flex:1"></span><button class="d" data-a="del">Eliminar</button></div>
<div class="g">${fld('band','Banda / bloque','text',s.band)}${fld('start','Inicio','time',s.start)}${fld('end','Fin','time',s.end)}</div>
<div class="g">${T.map(([k,l])=>`<div><label>${l}</label><textarea data-k="${k}">${esc(s[k])}</textarea></div>`).join('')}</div>
<div class="row" style="margin:12px 0"><button class="p" data-a="plot">🎛 Stage plot${(s.plot&&s.plot.els.length)?` (${s.plot.els.length} elementos)`:''}</button><button data-a="sheet">🖨 Hoja imprimible</button></div><h3 style="margin:14px 0 4px">Documentos (PDF, PNG, JPG)</h3><div id="files"></div>
<div class="row edit"><input type="file" id="up" accept=".pdf,.png,.jpg,.jpeg,image/png,image/jpeg,application/pdf" multiple style="width:auto"></div>`;
if(ro)$('#ed').querySelectorAll('[data-k],[data-a=up],[data-a=dn],[data-a=del]').forEach(e=>e.disabled=true);renderFiles()}
function urlFor(id){if(urls[id])return urls[id];if(!loading[id]){loading[id]=1;tx('files','readonly',t=>t.objectStore('files').get(id)).then(f=>{if(f){urls[id]=URL.createObjectURL(f.blob);renderFiles()}})}return''}
function renderFiles(){const s=S[sel];if(!s||!$('#files'))return;$('#files').innerHTML=(s.files||[]).map((f,i)=>{const u=urlFor(f.id),img=/^image\//.test(f.type);
return `<div class="f">${img&&u?`<img src="${u}">`:'📄'}${u?`<a href="${u}" target="_blank" rel="noopener">${esc(f.name)}</a>`:`<span style="flex:1;word-break:break-all">${esc(f.name)}<br><small class="hint">${fail[f.id]?'⚠ No disponible todavía: revisa tu conexión o pide al Stage Manager que publique de nuevo.':'Descargando…'}</small></span><button data-a="retry" data-i="${i}">↻ Reintentar</button>`}${img&&u?`<button data-a="view" data-i="${i}">Ver grande</button>`:''}<button class="d edit" data-a="rm" data-i="${i}">Quitar</button></div><div class="big" id="b${i}"></div>`}).join('')||'<div style="color:var(--mu)">Sin archivos adjuntos.</div>'}
function render(){if(!sel||!S[sel])sel=ids()[0]||null;renderList();build()}
$('#list').onclick=e=>{const c=e.target.closest('.it');if(c){sel=c.dataset.id;document.body.classList.add('ed');renderList();build()}};
$('#ed').addEventListener('input',e=>{const k=e.target.dataset.k;if(k&&sel&&!ro)save(sel,{[k]:e.target.value})});
$('#ed').addEventListener('change',e=>{if(e.target.id==='up')upload(e.target.files)});
$('#ed').addEventListener('click',async e=>{const a=e.target.dataset.a;if(!a)return;if(a==='plot'){openPlot(sel);return}if(a==='sheet'){openSheet(sel);return}if(a==='back'){document.body.classList.remove('ed');return}let x0;const L=ids(),i=L.indexOf(sel);
if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;if(j<0||j>=L.length||cat(S[L[j]])!==cat(S[x0=L[i]]))return;const x=L[i],y=L[j],ox=S[x].order,oy=S[y].order;save(x,{order:oy});save(y,{order:ox})}
if(a==='del'&&confirm('¿Eliminar este bloque y sus adjuntos?')){const id=sel,fs=S[id].files||[];sel=null;document.body.classList.remove('ed');delete S[id];setMeta({dirty:true});await tx(['scenes','files'],'readwrite',t=>{t.objectStore('scenes').delete(id);fs.forEach(f=>t.objectStore('files').delete(f.id))});render()}
const fi=+e.target.dataset.i,fs=(S[sel]||{}).files||[];
if(a==='rm'&&confirm('¿Quitar este archivo?')){const f=fs[fi];save(sel,{files:fs.filter((_,n)=>n!==fi)});await tx('files','readwrite',t=>t.objectStore('files').delete(f.id));build()}
if(a==='retry'){const id=fs[fi].id;delete fail[id];fetchFile(id,1).then(f=>{if(f){urls[id]=URL.createObjectURL(f.blob);delete fail[id]}else fail[id]=1;renderFiles()})}
if(a==='view'){const b=$('#b'+fi),u=urlFor(fs[fi].id);b.innerHTML=b.innerHTML?'':(u?`<img src="${u}">`:'<div class="hint">El archivo aún no está disponible.</div>')}});
async function upload(list){if(!sel||ro)return;const id=sel;let fs=[...(S[id].files||[])];for(let f of list){f=await shrink(f);const fid='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);try{await tx('files','readwrite',t=>t.objectStore('files').put({id:fid,name:f.name,type:f.type,blob:f}));fs.push({id:fid,name:f.name,type:f.type})}catch(er){msg('Error al subir: '+er.message)}}save(id,{files:fs});build()}
$('#add').onclick=async()=>{sel=await create({cat:(S[sel]||{}).cat||'SHOW'});document.body.classList.add('ed');render()};
$('#ro').checked=ro;document.body.classList.toggle('ro',ro);
$('#ro').onchange=e=>{ro=e.target.checked;localStorage.setItem('tsm-ro',ro?'1':'0');document.body.classList.toggle('ro',ro);build()};
/* exportar / importar */
const toURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$('#exp').onclick=async()=>{try{await Promise.all(Object.keys(pend).map(flush));const sc=await tx('scenes','readonly',t=>t.objectStore('scenes').getAll());const fl=await tx('files','readonly',t=>t.objectStore('files').getAll());
const files=await Promise.all(fl.map(async f=>({id:f.id,name:f.name,type:f.type,data:await toURL(f.blob)})));const now=new Date().toISOString();
const blob=new Blob([JSON.stringify({app:'teleton-sm',v:1,exported:now,scenes:sc,files})],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date();a.download=`teleton-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.json`;a.click();setMeta({exported:now,dirty:false})}catch(e){msg('Error al exportar: '+e.message)}};
